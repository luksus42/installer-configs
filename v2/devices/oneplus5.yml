name: "Oneplus 5/5T"
codename: "dumpling"
aliases:
  - "cheeseburger"
  - "OnePlus5"
  - "oneplus5"
  - "OnePlus5T"
  - "oneplus5t"
formfactor: "phone"
doppelgangers: []
user_actions:
  update:
    title: "Update to latest available version"
    description: "Before installing anything, make sure the OnePlus 5(T) is updated to the latest version of OxygenOS (10.0.1)."
    link: "https://www.oneplus.com/support/softwareupgrade/details?code=PM1574156155944"
  recovery:
    title: "Reboot to Recovery"
    description: > 
      With the device powered off, hold Volume Down + Power.
        With the device in bootloader mode, use the volume buttons to select "Recovery mode" and press the power button to confirm.
    image: "phone_power_down"
    button: true
  bootloader:
    title: "Reboot to Bootloader"
    description: >
      With the device powered off, hold Volume Up + Power. 
        If flashing fails, disconnect the device, click "Try Again", reboot to bootloader and reconnect the device.
    image: "phone_power_up"
    button: true
  lvm-migration:
    title: "LVM Migration"
    description: >
      On first install of the new recovery, we need to increase the available size for the rootfs.
        When recovery is booted, wait until "lvm-migration" is finished. Watch the log output in the bottom of the device.
        If there is no output at all or when it displays, that it is finished, push the "Continue"-Button in the installer.
    button: true
unlock:
  - "update"
handlers:
  bootloader_locked:
    actions:
      - fastboot:oem_unlock:
operating_systems:
  - name: "Ubuntu Touch"
    compatible_installer: ">=0.9.2-beta"
    options:
      - var: "channel"
        name: "Channel"
        tooltip: "The release channel"
        link: "https://docs.ubports.com/en/latest/about/process/release-schedule.html"
        type: "select"
        remote_values:
          systemimage:channels:
      - var: "wipe"
        name: "Wipe Userdata"
        tooltip: "Wipe personal data (required for new installs)"
        type: "checkbox"
      - var: "bootstrap"
        name: "Bootstrap"
        tooltip: "Flash system partitions using fastboot"
        type: "checkbox"
        value: true
    prerequisites: []
    steps:
      - actions:
          # latest artifacts from https://gitlab.com/ubports/porting/community-ports/android9/oneplus-5/oneplus-cheeseburger-dumpling
          - core:download:
              group: "firmware"
              files:
                - url: "https://gitlab.com/ubports/porting/community-ports/android9/oneplus-5/oneplus-cheeseburger-dumpling"
                  name: "artifacts.zip"
          - core:unpack:
              group: "firmware"
              files:
                - archive: "artifacts.zip"
                  dir: "unpacked"
          - core:unpack:
              group: "firmware"
              files:
                - archive: "unpacked/out/device_dumpling.tar.xz"
                  dir: "unpacked"
          - core:unpack:
              group: "firmware"
              files:
                - archive: "unpacked/device_dumpling.tar"
                  dir: "unpacked"
        condition:
          var: "bootstrap"
          value: true
      - actions:
          - adb:reboot:
              to_state: "bootloader"
        fallback:
          - core:user_action:
              action: "bootloader"
      - actions:
          - fastboot:flash:
              partitions:
                - partition: "recovery"
                  file: "unpacked/partitions/recovery.img"
                  group: "firmware"
                - partition: "boot"
                  file: "unpacked/partitions/boot.img"
                  group: "firmware"
        condition:
          var: "bootstrap"
          value: true
      - actions:
          - fastboot:format:
              partition: "userdata"
        condition:
          var: "wipe"
          value: true
      - actions:
          - adb:reboot:
              to_state: "recovery"
        fallback:
          - core:user_action:
              action: "recovery"
      - actions:
          - core:user_action:
              action: "lvm-migration"
        condition:
          var: "bootstrap"
          value: true
      - actions:
          - systemimage:install:
              verify_recovery: true
      - actions:
          - adb:reboot:
              to_state: "recovery"
        fallback:
          - core:user_action:
              action: "recovery"
    slideshow: []
